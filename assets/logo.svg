<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="coding-guard logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#12203A"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.2" y1="0.1" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.45" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <circle cx="512" cy="460" r="430" fill="url(#glow)"/>
  <rect x="40" y="40" width="944" height="944" rx="180" fill="none" stroke="#7DD3FC" stroke-opacity="0.10" stroke-width="2"/>

  <path d="M512 156 L812 274 L790 608 Q768 800 512 896 Q256 800 234 608 L212 274 Z"
        fill="url(#shield)" filter="url(#shadow)"/>
  <path d="M512 156 L812 274 L790 608 Q768 800 512 896 Q256 800 234 608 L212 274 Z"
        fill="url(#sheen)" stroke="#B8FFF0" stroke-opacity="0.45" stroke-width="5"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 448 L470 534 L370 620" stroke="#FFFFFF" stroke-width="60"/>
    <path d="M522 620 H652" stroke="#F59E0B" stroke-width="60"/>
  </g>
</svg>
